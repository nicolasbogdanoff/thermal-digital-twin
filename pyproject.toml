[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-digital-twin"
version = "0.1.0"
description = "A reproducible first-order thermal digital twin demonstrator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["thermal_digital_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
